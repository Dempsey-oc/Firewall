name: ci

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_XMLDOC_MODE: skip

jobs:
  build-and-test:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: restore
        run: dotnet restore Firewall.sln --locked-mode || dotnet restore Firewall.sln

      - name: build (release, deterministic)
        run: dotnet build Firewall.sln -c Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: test (with coverage)
        run: dotnet test Firewall.sln -c Release --no-build --logger "trx" --collect:"XPlat Code Coverage" --results-directory artifacts/test

      - name: upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: artifacts/test/

  pack:
    name: pack
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: pack
        run: dotnet pack Firewall.sln -c Release -o artifacts/packages -p:ContinuousIntegrationBuild=true

      - name: upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nupkgs
          path: artifacts/packages/

      - name: attest provenance (SLSA L3)
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: artifacts/packages/*.nupkg

  benchmark:
    name: benchmark (smoke)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
      - name: benchmark smoke run
        run: dotnet run --project bench/Firewall.Benchmarks -c Release -- --job dry --filter "*CidrTrie*"

  codeql:
    name: codeql
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: csharp
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
      - run: dotnet build Firewall.sln -c Release
      - uses: github/codeql-action/analyze@v3
        with:
          category: csharp

  trim-aot-smoke:
    name: aot publish smoke
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
      - name: native-aot publish (abstractions+core)
        run: |
          for proj in src/Firewall.Abstractions src/Firewall.Core; do
            dotnet publish $proj -c Release -r linux-x64 \
              -p:PublishAot=true \
              -p:IsAotCompatible=true \
              -p:TrimMode=full \
              -p:SuppressTrimAnalysisWarnings=false
          done
