name: ci

on:
  push:
    branches: [ master, main, dev ]
  pull_request:
    branches: [ master, main, dev ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_XMLDOC_MODE: skip

jobs:
  build-and-test:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    steps:
      - name: harden runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x

      - name: restore
        run: dotnet restore Firewall.sln --locked-mode || dotnet restore Firewall.sln

      - name: build (release, deterministic)
        run: dotnet build Firewall.sln -c Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: test (with coverage)
        run: dotnet test Firewall.sln -c Release --no-build --logger "trx" --collect:"XPlat Code Coverage" --results-directory artifacts/test --settings coverlet.runsettings

      - name: upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: artifacts/test/

      - name: install reportgenerator
        if: matrix.os == 'ubuntu-latest'
        run: dotnet tool install -g dotnet-reportgenerator-globaltool

      - name: enforce coverage gate (>=85% line coverage on src/)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.dotnet/tools:$PATH"
          reportgenerator \
            -reports:'artifacts/test/**/coverage.cobertura.xml' \
            -targetdir:artifacts/coverage \
            -reporttypes:'Cobertura;TextSummary;MarkdownSummaryGithub' \
            -assemblyfilters:'+Firewall*;-*.Tests;-Firewall.Benchmarks;-BasicApp'
          echo '## Coverage' >> "$GITHUB_STEP_SUMMARY"
          cat artifacts/coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          line=$(grep -oP 'line-rate="\K[0-9.]+' artifacts/coverage/Cobertura.xml | head -1)
          pct=$(awk -v r="$line" 'BEGIN{printf "%.2f", r*100}')
          echo "Total line coverage: ${pct}%"
          awk -v p="$pct" 'BEGIN{ if (p+0 < 85.0) { print "FAIL: line coverage " p "% < 85%"; exit 1 } else { print "OK: line coverage " p "% >= 85%" } }'

      - name: upload coverage report
        if: matrix.os == 'ubuntu-latest' && always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: artifacts/coverage/

  pack:
    name: pack
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: harden runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x

      - name: pack
        run: dotnet pack Firewall.sln -c Release -o artifacts/packages -p:ContinuousIntegrationBuild=true

      - name: sign packages (self-signed dry-run)
        shell: bash
        run: |
          set -euo pipefail

          # Generate an ephemeral self-signed cert for the dry-run. In Phase 16
          # a production cert (e.g. from DigiCert or SignPath) replaces this
          # block via repository secrets; the rest of the step is identical.
          openssl req -x509 -newkey rsa:4096 -sha256 -days 1 -nodes \
            -keyout /tmp/firewall-sign.key \
            -out    /tmp/firewall-sign.crt \
            -subj   "/CN=Firewall CI Dry-Run/O=Firewall contributors/C=GB"

          openssl pkcs12 -export \
            -inkey  /tmp/firewall-sign.key \
            -in     /tmp/firewall-sign.crt \
            -out    /tmp/firewall-sign.pfx \
            -passout pass:dryrun

          # Sign every produced .nupkg with the ephemeral cert + an RFC 3161
          # timestamp from a public TSA. The timestamp keeps the signature
          # verifiable after the cert itself expires.
          for pkg in artifacts/packages/*.nupkg; do
            dotnet nuget sign "$pkg" \
              --certificate-path /tmp/firewall-sign.pfx \
              --certificate-password dryrun \
              --timestamper http://timestamp.digicert.com
          done

          # Sanity-check: every nupkg now carries a signature block.
          # Verify's chain check will fail on the self-signed cert; that's
          # expected in the dry-run — we're testing the pipeline, not trust.
          for pkg in artifacts/packages/*.nupkg; do
            dotnet nuget verify "$pkg" --all || echo "expected dry-run cert verification failure: $pkg"
          done

      - name: upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nupkgs
          path: artifacts/packages/

      - name: attest provenance (SLSA L3)
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: artifacts/packages/*.nupkg

  benchmark:
    name: benchmark (smoke)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: harden runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
      - name: benchmark smoke run
        run: dotnet run --project bench/Firewall.Benchmarks -c Release -- --job dry --filter "*CidrTrie*"

  codeql:
    name: codeql
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: harden runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: csharp
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
      - run: dotnet build Firewall.sln -c Release
      - uses: github/codeql-action/analyze@v3
        with:
          category: csharp

  trim-aot-smoke:
    name: aot publish smoke
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: harden runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
      - name: native-aot publish (abstractions+core)
        run: |
          for proj in src/Firewall.Abstractions src/Firewall.Core; do
            dotnet publish $proj -c Release -f net10.0 -r linux-x64 \
              -p:PublishAot=true \
              -p:IsAotCompatible=true \
              -p:TrimMode=full \
              -p:SuppressTrimAnalysisWarnings=false
          done
